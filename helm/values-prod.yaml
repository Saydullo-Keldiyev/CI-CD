replicaCount: 2

image:
  repository: saydullox/simple-java-app
  tag: "latest"

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_OPTS: "-Xms256m -Xmx512m"

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1024Mi"

ingress:
  enabled: true
  className: nginx
  host: simple-java-app.example.com
  path: /

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
